# Railway deployment configuration
# Deploys the combined Node.js + Python container to Railway Hobby plan
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/combined/Dockerfile"

[deploy]
startCommand = "supervisord -c /etc/supervisord.conf"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Production environment variables are set in Railway Dashboard:
# Settings > Variables. See .env.example for the complete list.
