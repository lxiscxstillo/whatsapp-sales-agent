app = 'wppconnect-sales-agent'
primary_region = 'gru'

[build]

[env]
  PORT = "21465"

[http_service]
  internal_port = 21465
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/"
    port = 21465
    timeout = "10s"
    type = "http"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "wppconnect_data"
  destination = "/data"
