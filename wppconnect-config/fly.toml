app = 'wppconnect-sales-agent'
primary_region = 'gru'

[build]

[env]
  PORT = "21465"

[http_service]
  internal_port = 21465
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "wppconnect_data"
  destination = "/data"
